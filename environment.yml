name: cad2urdf
channels:
  - conda-forge
# STEP/IGES assembly import uses the OCP namespace from cadquery-ocp.
# Install it through the project's [step] extra; pythonocc-core uses the
# incompatible OCC.Core namespace and is not a drop-in substitute.
dependencies:
  - python=3.10
  - pip
  - pip:
      - -e .[dev,step]
