[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2urdf"
version = "1.0.0"
description = "Convert CAD assemblies (STEP/IGES/STL/OBJ) to ROS-ready URDF packages"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "boelnasr" }]
license = "MIT"
dependencies = [
    "numpy>=1.24,<3",
    "trimesh>=4.0",
    "PyYAML>=6.0",
    # trimesh builds convex hulls with scipy.spatial; without it the inertia
    # fallback for non-watertight meshes silently returns zero mass.
    "scipy>=1.10",
]

[project.optional-dependencies]
# ManipulaPy backs the optional post-emit validation gate. Only
# core/validation/manipulapy_gate.py uses it, via a lazy import inside the
# function body, so the default install never needs it.
# Floor is 1.4.2: 1.3.1-1.4.1 print an emoji banner to stdout on import, which
# corrupts cad2urdf-mcp's JSON-RPC stdout and raises UnicodeEncodeError on
# cp1252 (Windows) consoles. 1.4.2 writes a plain-ASCII greeting to stderr.
# Install as: pip install -e ".[dev,urdf-io]" when you need ManipulaPy validation.
urdf-io = [
    "manipulapy>=1.4.2",
]
# STEP/IGES import via OCP (cadquery-ocp — the pip-installable OCCT binding).
# Heavy wheel. core/parsers/step.py lazy-imports OCP inside function bodies so the
# default install stays small and importing the package without OCP never crashes.
# Install as: pip install -e ".[step]".
step = [
    "cadquery-ocp>=7.7",
]
gui = [
    "PyQt6>=6.6",
    "pyvistaqt>=0.11",
    "pyvista>=0.44",
    "vtk>=9.3",
]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-qt>=4.4",
    "mypy>=1.10",
    # Pinned to the 0.15 minor: there is no [tool.ruff] config, so a newer
    # ruff could enable new default rules and fail CI on locally-clean code.
    "ruff>=0.15,<0.16",
    "types-PyYAML",
    "tomli>=2; python_version < '3.11'",
]
# Install as: pip install -e ".[gui,mcp]" for MCP-controlled GUI workflows, or
# ".[gui,mcp,step]" when STEP/IGES import_cad support is also needed.
mcp = [
    "mcp>=1.2.0,<2",
]

[project.scripts]
cad2urdf = "cad2urdf.cli.main:main"
cad2urdf-gui = "cad2urdf.gui.app:main"
cad2urdf-mcp = "cad2urdf.mcp.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: long-running integration tests",
    "needs_step_fixture: requires generated STEP fixtures",
    "gui: requires Qt + pytest-qt (set QT_QPA_PLATFORM=offscreen in CI)",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/cad2urdf/core", "src/cad2urdf/gui", "src/cad2urdf/mcp"]

[[tool.mypy.overrides]]
module = ["trimesh.*", "OCC.*", "OCP.*", "ManipulaPy.*", "pyvistaqt.*", "pyvista.*", "vtk.*"]
ignore_missing_imports = true

# gui code uses Qt subclassing patterns that don't play well with --strict;
# we type-check it leniently for now (warn but don't require disallow_untyped_defs).
# PyQt6 stubs declare statusBar()/addToolBar()/model() as `Foo | None` even though
# they never return None in practice, so union-attr noise is silenced for gui.
# PyQt6 >= 6.12 stubs declare pyqtSignal(..., arguments: Sequence[str]) with no
# default, so every `pyqtSignal(object)` reports call-arg; 6.11 and the runtime
# don't require it. A per-line ignore would trip warn_unused_ignores on <= 6.11.
[[tool.mypy.overrides]]
module = ["cad2urdf.gui.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disable_error_code = [
    "union-attr",
    "assignment",
    "call-overload",
    "arg-type",
    "has-type",
    "no-any-return",
    "call-arg",
]
