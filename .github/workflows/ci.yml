name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit tests (py3.10)
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,step,mcp]"

      - name: Pytest (unit suite)
        run: python -m pytest tests/unit

  ci:
    name: lint + type + test (py3.10)
    runs-on: ubuntu-22.04
    env:
      # Headless rendering for the Qt + PyVista/VTK GUI tests.
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system GL / Qt / xvfb libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 \
            libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            xvfb

      - name: Install package (core + dev + gui + step + mcp)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,step,mcp]"

      - name: Ruff (lint)
        run: ruff check src/cad2urdf tests

      - name: Mypy (strict)
        run: mypy

      - name: Pytest (full suite, headless)
        run: xvfb-run -a python -m pytest
